<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT B - MINI SLOT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Padauk', Tahoma, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        /* --- Login Modal Overlay --- */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .login-box {
            background-color: #151515;
            border: 2px solid #FFCC00;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }

        .login-title {
            color: #FFCC00;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1.5px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #aaaaaa;
        }

        .login-input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            background-color: #222222;
            border: 1px solid #444444;
            color: #ffffff;
            border-radius: 6px;
            outline: none;
        }

        .login-input:focus {
            border-color: #FFCC00;
        }

        .login-error {
            color: #FF4444;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-align: center;
            min-height: 20px;
            font-weight: 500;
        }

        .login-btn {
            background-color: #FFCC00;
            color: #000000;
            border: none;
            width: 100%;
            padding: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .login-btn:hover {
            background-color: #e6b800;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            background-color: #555555;
            color: #aaaaaa;
            cursor: not-allowed;
        }

        .register-link {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
        }

        .register-link a {
            color: #FFCC00;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* --- Alert Popup Box (Alert Modal) --- */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 15px;
        }

        .alert-box {
            background-color: #1a1a1a;
            border: 2px solid #EF5350;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 20px rgba(239, 83, 80, 0.4);
            text-align: center;
        }

        .alert-title {
            color: #EF5350;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .alert-message {
            font-size: 0.95rem;
            color: #dddddd;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .alert-ok-btn {
            background-color: #EF5350;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 10px 0;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .alert-ok-btn:hover {
            background-color: #e53935;
        }

        /* --- Loading Spinner & Countdown --- */
        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #000;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #countdownDisplay {
            font-size: 1rem;
            color: #FFCC00;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        /* --- Slot Game Container (95% Scale) --- */
        .container {
            width: 95%;
            max-width: 304px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            transform: scale(0.95);
        }

        .user-banner {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #FFCC00;
        }

        .user-banner span {
            font-weight: bold;
            color: #ffffff;
        }

        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        .wallet-btn {
            background-color: #1b5e20;
            color: #ffffff;
            border: 1px solid #2e7d32;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .wallet-btn:hover {
            background-color: #2e7d32;
        }

        .score-display {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            flex-grow: 1;
        }

        .gold-icon {
            font-size: 1.4rem;
        }

        .title {
            color: #FFCC00;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-icon {
            font-size: 1.4rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #121212;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #222222;
        }

        .cell {
            background-color: #222222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            user-select: none;
            border-radius: 6px;
            transition: all 0.15s ease;
            border: 2px solid transparent;
        }

        .cell.spinning {
            animation: pulse 0.1s infinite alternate;
        }

        .cell.winning {
            border-color: #FFCC00;
            box-shadow: 0 0 15px #FFCC00;
            background-color: #443c08;
            transform: scale(1.05);
            z-index: 2;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .bet-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
        }

        .bet-label {
            font-size: 0.9rem;
            color: #cccccc;
        }

        .bet-stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 8px;
        }

        .stepper-btn {
            background-color: #222222;
            color: #FFCC00;
            border: 1px solid #444444;
            width: 38px;
            height: 38px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background-color 0.1s;
        }

        .stepper-btn:hover {
            background-color: #333333;
        }

        .stepper-btn:active {
            transform: scale(0.95);
        }

        .bet-input {
            width: 50%;
            padding: 10px;
            font-size: 1.1rem;
            background-color: #151515;
            border: 1px solid #444444;
            color: #ffffff;
            border-radius: 8px;
            text-align: center;
            outline: none;
            font-weight: bold;
        }

        .bet-input:focus {
            border-color: #FF4500;
        }

        .message {
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
            min-height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 500;
        }

        .message.win {
            color: #66BB6A;
            font-weight: bold;
        }

        .message.error {
            color: #EF5350;
        }

        .spin-btn {
            background-color: #FF4500;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px 0;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.4);
        }

        .spin-btn:hover {
            background-color: #ff571a;
        }

        .spin-btn:active {
            transform: scale(0.98);
        }

        .spin-btn:disabled {
            background-color: #552100;
            color: #888888;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Login Box Popup -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div class="login-title">LOGIN</div>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="login-input" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="login-input" placeholder="Enter password">
            </div>
            <div class="login-error" id="loginError"></div>
            <button type="button" class="login-btn" id="loginBtn">
                <span id="btnText">LOGIN</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
            <div id="countdownDisplay">ကျန်ရှိချိန် - 10s</div>
            
            <div class="register-link">
                <a href="https://t.me/JellySue" target="_blank">အကောင့်ဖွင့်ရန်</a>
            </div>
        </div>
    </div>

    <!-- Alert Popup Box (Connection Timeout / Disconnect) -->
    <div class="alert-overlay" id="alertOverlay">
        <div class="alert-box">
            <div class="alert-title">သတိပေးချက်</div>
            <div class="alert-message" id="alertMessage">လိုင်းကျသွားပါသည် (Connection Lost)!</div>
            <button type="button" class="alert-ok-btn" id="alertOkBtn">အိုကေ</button>
        </div>
    </div>

    <!-- Main Game UI -->
    <div class="container">
        <div class="user-banner" id="userBanner" style="display: none;">
            User: <span id="displayUsername">-</span>
        </div>

        <div class="header-bar">
            <a href="https://t.me/JellySue" target="_blank" class="wallet-btn">💰 ငွေသွင်းငွေထုတ် ပြုလုပ်ရန်</a>
            <div class="score-display">
                <span class="gold-icon">🪙</span>
                <span id="score">5000</span>
            </div>
        </div>
        
        <div class="title">
            <span class="title-icon">🎰</span>
            MINI SLOT
            <span class="title-icon">🎰</span>
        </div>

        <div class="grid" id="grid">
            <div class="cell">❓</div>
            <div class="cell">❓</div>
            <div class="cell">❓</div>
            <div class="cell">❓</div>
            <div class="cell">❓</div>
            <div class="cell">❓</div>
            <div class="cell">❓</div>
            <div class="cell">❓</div>
            <div class="cell">❓</div>
        </div>

        <div class="bet-container">
            <label class="bet-label" for="betInput">လောင်းကြေး သတ်မှတ်ရန် :</label>
            <div class="bet-stepper">
                <button type="button" class="stepper-btn" id="minusBtn">-</button>
                <input type="number" id="betInput" class="bet-input" value="100" min="100">
                <button type="button" class="stepper-btn" id="plusBtn">+</button>
            </div>
        </div>

        <div class="message" id="message">
            <span>💡</span> ကံစမ်းရန် SPIN ကိုနှိပ်ပါ!
        </div>

        <button class="spin-btn" id="spinBtn">SPIN</button>
    </div>

    <script>
        // Page Reload လုပ်ပါက Session များကို ရှင်းလင်းပြီး Login ပြန်တောင်းရန်
        window.addEventListener('DOMContentLoaded', () => {
            sessionStorage.clear();
            localStorage.clear();
            loginOverlay.style.display = 'flex';
            userBanner.style.display = 'none';
        });

        const loginOverlay = document.getElementById('loginOverlay');
        const alertOverlay = document.getElementById('alertOverlay');
        const alertMessage = document.getElementById('alertMessage');
        const alertOkBtn = document.getElementById('alertOkBtn');

        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginError = document.getElementById('loginError');
        const scoreEl = document.getElementById('score');
        const userBanner = document.getElementById('userBanner');
        const displayUsername = document.getElementById('displayUsername');

        let socket = null;
        let countdownTimer = null;
        let secondsLeft = 10;
        let currentUsername = "";
        let currentPassword = "";
        let isLoggedIn = false;

        // Popup Box တွင် "အိုကေ" နှိပ်လိုက်မှသာ Login မျက်နှာပြင်သို့ ပြန်သွားရန်
        alertOkBtn.addEventListener('click', () => {
            alertOverlay.style.display = 'none';
            loginOverlay.style.display = 'flex';
            userBanner.style.display = 'none';
            usernameInput.value = '';
            passwordInput.value = '';
            loginError.textContent = '⚠️ ဆက်သွယ်မှု ပြတ်တောက်သွားပါသည်။';
            
            // ဂိမ်းခလုတ်များကို ပုံမှန်အနေအထားသို့ ပြန်လည်ပြင်ဆင်ခြင်း
            isSpinning = false;
            spinBtn.disabled = false;
            minusBtn.disabled = false;
            plusBtn.disabled = false;
            betInput.disabled = false;
            if (spinInterval) {
                clearInterval(spinInterval);
                spinInterval = null;
            }
            cells.forEach(cell => cell.classList.remove('spinning'));
        });

        function setLoginLoading(isLoading) {
            if (isLoading) {
                btnText.textContent = "Connecting...";
                btnSpinner.style.display = "block";
                countdownDisplay.style.display = "block";
                loginBtn.disabled = true;
                usernameInput.disabled = true;
                passwordInput.disabled = true;
            } else {
                btnText.textContent = "LOGIN";
                btnSpinner.style.display = "none";
                countdownDisplay.style.display = "none";
                loginBtn.disabled = false;
                usernameInput.disabled = false;
                passwordInput.disabled = false;
            }
        }

        function startCountdown() {
            secondsLeft = 10;
            countdownDisplay.textContent = `ကျန်ရှိချိန် - ${secondsLeft}s`;
            
            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                secondsLeft--;
                countdownDisplay.textContent = `ကျန်ရှိချိန် - ${secondsLeft}s`;

                if (secondsLeft <= 0) {
                    clearInterval(countdownTimer);
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.close();
                    }
                    loginError.textContent = '⚠️ အချိန်ကုန်သွားပါပြီ (Connection Timeout)!';
                    setLoginLoading(false);
                }
            }, 1000);
        }

        loginBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                loginError.textContent = '⚠️ Username နှင့် Password ဖြည့်စွက်ပေးပါ!';
                return;
            }

            loginError.textContent = '';
            setLoginLoading(true);
            startCountdown();

            try {
                socket = new WebSocket('wss://193.161.193.99:59265');

                socket.onopen = () => {
                    currentUsername = username;
                    currentPassword = password;
                    const payload = `login_${username}_${password}`;
                    socket.send(payload);
                };

                socket.onmessage = (event) => {
                    if (countdownTimer) clearInterval(countdownTimer);
                    const response = event.data.trim();

                    if (response === 'login_wrong') {
                        loginError.textContent = '⚠️ Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။';
                        setLoginLoading(false);
                        socket.close();
                    } 
                    else if (response.startsWith('login_')) {
                        const parts = response.split('_');
                        if (parts.length >= 3) {
                            const serverUsername = parts[1];
                            const goldAmount = parseInt(parts[2], 10);
                            
                            if (!isNaN(goldAmount)) {
                                score = goldAmount;
                                scoreEl.textContent = score;
                            }

                            displayUsername.textContent = serverUsername;
                            userBanner.style.display = "flex";
                        }
                        
                        isLoggedIn = true;
                        setLoginLoading(false);
                        loginOverlay.style.display = 'none';
                    }
                    else if (response.startsWith('spin_')) {
                        handleServerSpinResponse(response);
                    }
                };

                // Server Disconnect ဖြစ်သွားပါက (သို့မဟုတ် ချိတ်ဆက်မှုပြတ်တောက်ပါက) ဤနေရာတွင် ဖမ်းယူမည်
                socket.onerror = (error) => {
                    if (countdownTimer) clearInterval(countdownTimer);
                    if (isLoggedIn) {
                        alertMessage.textContent = '⚠️ Server နှင့် ချိတ်ဆက်မှု ပြတ်တောက်သွားပါသည် (Disconnect)!';
                        alertOverlay.style.display = 'flex';
                    } else {
                        loginError.textContent = '⚠️ Server သို့ ချိတ်ဆက်၍ မရပါ!';
                        setLoginLoading(false);
                    }
                };

                socket.onclose = () => {
                    if (countdownTimer) clearInterval(countdownTimer);
                    if (isLoggedIn) {
                        alertMessage.textContent = '⚠️ Server Disconnect ဖြစ်သွားပါသည်!';
                        alertOverlay.style.display = 'flex';
                    }
                };

            } catch (err) {
                if (countdownTimer) clearInterval(countdownTimer);
                loginError.textContent = '⚠️ Connection Error ဖြစ်ပေါ်နေပါသည်။';
                setLoginLoading(false);
            }
        });

        // Slot Game Logic (စလော့ပုံ ၆ ခု သတ်မှတ်ချက်)
        const slotSymbols = {
            '1': '⭐',
            '2': '🔑',
            '3': '🎈',
            '4': '🥇',
            '5': '🍒',
            '6': '💯'
        };

        const betSteps = [100, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];
        let score = 5000;
        let isSpinning = false;
        let spinInterval = null;
        let spinTimeout = null;
        let activeBetAmount = 100;

        const cells = document.querySelectorAll('.cell');
        const betInput = document.getElementById('betInput');
        const messageEl = document.getElementById('message');
        const spinBtn = document.getElementById('spinBtn');
        const minusBtn = document.getElementById('minusBtn');
        const plusBtn = document.getElementById('plusBtn');

        function checkDecimal(val) {
            return val.includes('.') || val.includes(',');
        }

        minusBtn.addEventListener('click', () => {
            if (isSpinning) return;
            let currentVal = parseInt(betInput.value, 10) || 100;
            
            let idx = betSteps.length - 1;
            while (idx >= 0 && betSteps[idx] >= currentVal) {
                idx--;
            }
            if (idx < 0) idx = 0;
            
            betInput.value = betSteps[idx];
        });

        plusBtn.addEventListener('click', () => {
            if (isSpinning) return;
            let currentVal = parseInt(betInput.value, 10) || 100;
            
            let idx = 0;
            while (idx < betSteps.length && betSteps[idx] <= currentVal) {
                idx++;
            }
            if (idx >= betSteps.length) idx = betSteps.length - 1;
            
            betInput.value = betSteps[idx];
        });

        function checkWin(gridState) {
            let winningLines = 0;
            const winningIndices = new Set();

            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let line of lines) {
                const [a, b, c] = line;
                if (gridState[a] === gridState[b] && gridState[b] === gridState[c]) {
                    winningLines++;
                    winningIndices.add(a);
                    winningIndices.add(b);
                    winningIndices.add(c);
                }
            }

            return { winningLines, winningIndices: Array.from(winningIndices) };
        }

        // SPIN နှိပ်လိုက်သောအခါ
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;

            const rawVal = betInput.value.trim();

            if (!rawVal || checkDecimal(rawVal)) {
                messageEl.className = 'message error';
                messageEl.innerHTML = '⚠️ ဒသမဂဏန်း ထည့်၍မရပါ! ကိန်းပြည့်သာ ထည့်ပေးပါ';
                return;
            }

            activeBetAmount = parseInt(rawVal, 10);

            if (isNaN(activeBetAmount) || activeBetAmount < 100) {
                messageEl.className = 'message error';
                messageEl.innerHTML = '⚠️ အနည်းဆုံး လောင်းကြေး ၁၀၀ သတ်မှတ်ပေးပါ';
                return;
            }

            if (activeBetAmount > score) {
                messageEl.className = 'message error';
                messageEl.innerHTML = '⚠️ အမှတ် မလုံလောက်ပါ!';
                return;
            }

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alertMessage.textContent = '⚠️ Server သို့ ချိတ်ဆက်မထားပါ!';
                alertOverlay.style.display = 'flex';
                return;
            }

            // Controls များကို လော့ခ်ချခြင်း
            isSpinning = true;
            spinBtn.disabled = true;
            minusBtn.disabled = true;
            plusBtn.disabled = true;
            betInput.disabled = true;

            cells.forEach(cell => {
                cell.classList.remove('winning', 'spinning');
            });

            messageEl.className = 'message';
            messageEl.textContent = 'လှည့်နေသည်...';

            // Server သို့ spin_user_pass_amount ပုံစံဖြင့် ပို့ခြင်း
            const spinPayload = `spin_${currentUsername}_${currentPassword}_${activeBetAmount}`;
            socket.send(spinPayload);

            // ရုပ်ပုံများ လည်နေစေရန် Animation စတင်ခြင်း
            const symbolKeys = Object.keys(slotSymbols);
            cells.forEach(cell => cell.classList.add('spinning'));
            spinInterval = setInterval(() => {
                cells.forEach(cell => {
                    const randomKey = symbolKeys[Math.floor(Math.random() * symbolKeys.length)];
                    cell.textContent = slotSymbols[randomKey];
                });
            }, 80);

            // ၁၀ စက္ကန့် Timeout (Server မှ respond မလာပါက Popup Box ပေါ်လာစေရန်)
            if (spinTimeout) clearTimeout(spinTimeout);
            spinTimeout = setTimeout(() => {
                if (isSpinning) {
                    if (spinInterval) {
                        clearInterval(spinInterval);
                        spinInterval = null;
                    }
                    cells.forEach(cell => cell.classList.remove('spinning'));
                    
                    // Connection Timeout ဖြစ်သည့်အခါ Popup Box ပြသခြင်း
                    alertMessage.textContent = '⚠️ အချိန်ကုန်သွားပါပြီ (Connection Timeout 10s)! လိုင်းကျနေပါသည်။';
                    alertOverlay.style.display = 'flex';
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.close();
                    }
                }
            }, 10000);
        });

        // Server မှ spin_123456789_gold ပုံစံဖြင့် ရလဒ်ရောက်ရှိလာခြင်း
        function handleServerSpinResponse(response) {
            const parts = response.split('_');
            if (parts.length >= 3) {
                // Response ရလာပြီဖြစ်၍ 10s Timeout ကို ဖြတ်တောက်မည်
                if (spinTimeout) {
                    clearTimeout(spinTimeout);
                    spinTimeout = null;
                }

                // ချက်ချင်းရောက်လာသော်လည်း ၁ စက္ကန့် (1000ms) ဆက်လည်စေရန်
                setTimeout(() => {
                    if (spinInterval) {
                        clearInterval(spinInterval);
                        spinInterval = null;
                    }
                    cells.forEach(cell => cell.classList.remove('spinning'));

                    const gridString = parts[1]; // ဥပမာ: "123456789"
                    const newGold = parseInt(parts[2], 10);

                    const finalGridState = [];
                    for (let i = 0; i < cells.length; i++) {
                        if (i < gridString.length) {
                            const charCode = gridString.charAt(i);
                            const mappedSymbol = slotSymbols[charCode] || '❓';
                            cells[i].textContent = mappedSymbol;
                            finalGridState.push(mappedSymbol);
                        }
                    }

                    if (!isNaN(newGold)) {
                        score = newGold;
                        scoreEl.textContent = score;
                    }

                    const { winningLines, winningIndices } = checkWin(finalGridState);

                    if (winningLines > 0) {
                        winningIndices.forEach(idx => {
                            cells[idx].classList.add('winning');
                        });
                        messageEl.className = 'message win';
                        messageEl.innerHTML = `🎉 ဂုဏ်ယူပါတယ်! ${winningLines} တန်းတူပြီး အနိုင်ရရှိပါသည်!`;
                    } else {
                        messageEl.className = 'message';
                        messageEl.innerHTML = '<span>😢</span> မထိပါဘူး၊ ထပ်ကြိုးစားပါ!';
                    }

                    // ခလုတ်များကို ပြန်လည်အသုံးပြုနိုင်ရန် ဖွင့်ပေးခြင်း
                    isSpinning = false;
                    spinBtn.disabled = false;
                    minusBtn.disabled = false;
                    plusBtn.disabled = false;
                    betInput.disabled = false;
                }, 1000); // ၁ စက္ကန့် ဆက်လည်စေရန်
            }
        }
    </script>
</body>
</html>
