<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Test</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      text-align: center;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <button id="connectBtn">WebSocket ချိတ်ဆက်မယ်</button>
  <p id="status">အခြေအနေ: မချိတ်ဆက်ရသေးပါ</p>

  <script>
    const wsUrl = "ws://127.0.0.1:7799";
    const connectBtn = document.getElementById("connectBtn");
    const statusText = document.getElementById("status");

    connectBtn.addEventListener("click", () => {
      statusText.textContent = "ချိတ်ဆက်နေပါသည်...";

      const socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        statusText.textContent = "ချိတ်ဆက်မှု အောင်မြင်ပါတယ်! (Connected)";
        statusText.style.color = "green";
      };

      socket.onerror = () => {
        statusText.textContent = "ချိတ်ဆက်လို့ မရပါဘူး။ (Connection Failed)";
        statusText.style.color = "red";
      };

      socket.onclose = (event) => {
        if (!event.wasClean) {
          statusText.textContent = "ချိတ်ဆက်လို့ မရပါဘူး။ (Connection Failed)";
          statusText.style.color = "red";
        }
      };
    });
  </script>

</body>
</html>
